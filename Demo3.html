<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Explore Connersville's Past</title>
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">

<style>

html,body{margin:0;height:100%;font-family:Arial,sans-serif}

#bar{position:absolute;z-index:5;top:0;left:0;right:0;background:#E47303;color:#fff;padding:calc(6px + env(safe-area-inset-top)) 10px 8px}
#bar h1{font-size:17px;margin:0 0 6px}

#q{width:100%;box-sizing:border-box;padding:8px;font-size:16px;border:0;border-radius:4px}

#res{list-style:none;margin:2px 0 0;padding:0;background:#fff;color:#000;border-radius:4px;max-height:40vh;overflow:auto}
#res button{width:100%;text-align:left;padding:10px;border:0;background:none;font-size:15px;border-bottom:1px solid #eee}

#map{position:absolute;inset:0}

#leaders{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none;overflow:visible}
#leaders path{fill:#E47303;stroke:#fff;stroke-width:1.5}

.pin{width:44px;height:44px;border-radius:50%;border:3px solid var(--c,#E47303);background:#E47303;box-shadow:0 0 0 2px #fff,0 1px 4px #0007;padding:0;overflow:hidden;cursor:pointer}
.pin img{width:100%;height:100%;object-fit:cover;display:block}
.pin.parent{width:58px;height:58px;border:4px solid var(--c,#E47303);box-shadow:0 0 0 2px #fff,0 1px 5px #0008}
.pin:focus-visible{outline:3px solid #ff9800}
.pin.sel{border-color:#ff9800}
.pin.gone{border-style:dashed}
.pin.gone img{filter:grayscale(1)}

#tools{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px;font-size:13px;align-items:center}
#tools button{padding:6px 10px;border:0;border-radius:4px;background:#fff;color:#000}
#tools label{display:flex;align-items:center;gap:6px;flex:1 1 210px}
#tools input[type=range]{flex:1}

#panel{position:absolute;z-index:6;left:0;right:0;bottom:0;max-height:55vh;overflow:auto;background:#fff;padding:12px 14px calc(14px + env(safe-area-inset-bottom));box-shadow:0 -2px 8px #0005;box-sizing:border-box}
#panel img{width:100%;max-height:240px;object-fit:cover;border-radius:6px}
#panel h2{margin:8px 0 4px;font-size:19px}
#panel h3{margin:12px 0 4px;font-size:15px}
#x{position:absolute;right:8px;top:6px;font-size:26px;border:0;background:none}

.kid{display:block;width:100%;text-align:left;padding:10px;margin:3px 0;border:1px solid #E47303;border-radius:6px;background:#fff;font-size:15px}

@media(min-width:700px){
  #panel{left:auto;width:380px;top:96px;bottom:auto;max-height:calc(100% - 110px);right:10px;border-radius:8px}
}

/* WELCOME GIF INTRO */
#welcomeOverlay{position:fixed;inset:0;z-index:99999;overflow:hidden;pointer-events:auto;background:transparent;cursor:pointer}
#welcomeImage{position:absolute;max-width:100vw;max-height:100vh;width:auto;height:auto;user-select:none;-webkit-user-drag:none;left:var(--welcome-x,50%);top:var(--welcome-y,50%);transform:translate(-50%,calc(-50% + 110vh));transition:transform 650ms cubic-bezier(.22,.61,.36,1)}
#welcomeOverlay.show #welcomeImage{transform:translate(-50%,-50%)}
#welcomeOverlay.exit #welcomeImage{transform:translate(-50%,calc(-50% - 110vh))}
#welcomeSkip{position:absolute;z-index:2;left:50%;bottom:calc(14px + env(safe-area-inset-bottom));transform:translateX(-50%);padding:6px 12px;border-radius:4px;background:rgba(0,0,0,.45);color:#fff;font-size:12px;letter-spacing:.04em;pointer-events:none;opacity:.8}

#spotBox{position:fixed;inset:0;z-index:9000;background:#000a;display:flex;align-items:center;justify-content:center;padding:14px}
#spotBox[hidden]{display:none}
#spotCard{position:relative;background:#fff;border:6px solid #D55E00;border-radius:18px;max-width:560px;max-height:92vh;overflow:auto;padding:14px}
#spotCard img{width:100%;max-height:52vh;object-fit:contain;border-radius:8px;background:#eee}
#spotCard h2{margin:10px 0 4px}
#sp-x{position:absolute;right:8px;top:2px;font-size:30px;border:0;background:none}
#sp-go{display:block;margin-top:12px;padding:10px 14px;border:0;border-radius:6px;background:#D55E00;color:#fff;font-size:16px}
.spotpin{width:22px;height:22px;border-radius:50%;background:#D55E00;border:4px solid #fff;box-shadow:0 0 0 4px #D55E00,0 0 12px #000a}

#welcomeSite{position:absolute;inset:0;pointer-events:none}
#wsLine{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
#wsLine path{stroke:#fff;stroke-width:2}
#wsPhoto{position:absolute;left:14px;top:calc(104px + env(safe-area-inset-top));width:min(46vw,230px);height:min(46vw,230px);border-radius:50%;object-fit:cover;border:8px solid var(--c);background:#fff;box-shadow:0 0 0 3px #fff,0 4px 14px #0007}
#wsBox{position:absolute;left:14px;top:calc(104px + min(46vw,230px) + 14px + env(safe-area-inset-top));width:min(calc(100vw - 28px),360px);box-sizing:border-box;background:#fff;border:6px solid var(--c);border-radius:18px;padding:12px 14px;box-shadow:0 0 0 3px #fff,0 4px 14px #0006}
#welcomeSite.right #wsPhoto,#welcomeSite.right #wsBox{left:auto;right:14px}
#wsBox h2{margin:0 0 6px;font-size:21px}
#wsBox p{margin:0;font-size:16px;line-height:1.35}
#wsBox small{display:block;margin-top:6px;color:#555}
#welcomeSite.in #wsPhoto,#welcomeSite.in #wsBox,#welcomeSite.in #wsLine{animation:wsIn 450ms cubic-bezier(.22,.61,.36,1) both}
@keyframes wsIn{from{opacity:0;transform:translateY(18px) scale(.96)}to{opacity:1;transform:none}}
.pin.spot{box-shadow:0 0 0 6px #fff,0 0 0 11px var(--c)}

@media(prefers-reduced-motion:reduce){
  #welcomeSite.in #wsPhoto,#welcomeSite.in #wsBox,#welcomeSite.in #wsLine{animation:none}
  #welcomeImage{transition:none}
}

</style>
</head>

<body>

<div id="welcomeOverlay" role="button" aria-label="Skip welcome introduction">
  <img id="welcomeImage" alt="Discover Historic Connersville">
  <div id="welcomeSite" hidden>
    <svg id="wsLine"></svg>
    <img id="wsPhoto" alt="">
    <div id="wsBox"><h2 id="wsName"></h2><p id="wsText"></p><small id="wsIn"></small></div>
  </div>
  <div id="welcomeSkip">TAP OR CLICK TO SKIP</div>
</div>

<div id="spotBox" hidden role="dialog" aria-modal="true" aria-labelledby="sp-title">
  <div id="spotCard">
    <button id="sp-x" type="button" aria-label="Close">&times;</button>
    <img id="sp-img" alt="" onerror="this.hidden=true">
    <h2 id="sp-title"></h2><p id="sp-when"><b></b></p><p id="sp-text"></p><small id="sp-credit"></small>
    <button id="sp-go" type="button">Explore the map</button>
  </div>
</div>

<div id="bar">
  <h1>Explore Connersville's Past</h1>
  <input id="q" type="search" placeholder="Search places..." aria-label="Search places">
  <ul id="res" hidden></ul>
  <div id="tools">
    <button id="near" type="button">Near me</button>
    <button id="tour" type="button" hidden>Take the tour</button>
    <label>Year: <b id="yv">All</b> <input id="yr" type="range" aria-label="Show sites that existed in this year"></label>
    <label id="ovw" hidden>Old map <select id="ovs"></select> <input id="ov" type="range" min="0" max="100" value="0" aria-label="Old map opacity"></label>
  </div>
</div>

<div id="map"></div>
<aside id="panel" hidden aria-live="polite"></aside>

<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script src="https://unpkg.com/papaparse@5.4.1/papaparse.min.js"></script>

<script>

/* ============================================================
   WELCOME GIF INTRO
   ============================================================ */

const WELCOME_DISPLAY_TIME = 1500;
const WELCOME_TRANSITION_TIME = 650;
const WELCOME_SITE_TIME = 4000;

const WELCOME_STEPS = [
  { gif: "welcome1.gif" },
  { type: "sites" }
];

function startWelcome(){

  const overlay = document.getElementById("welcomeOverlay");
  const image   = document.getElementById("welcomeImage");

  if (!overlay || !image || !WELCOME_STEPS.length) return;

  let index = 0;
  let timer = null;
  let stopped = false;

  WELCOME_STEPS.forEach(step => {
    const preload = new Image();
    if (step.gif) preload.src = step.gif;
  });

  let siteTimer = null, lastId = null, tries = 0;
  const siteBox = document.getElementById("welcomeSite");

  function startSites() {
    image.hidden = true;
    siteBox.hidden = false;
    nextSite();
  }

  function nextSite() {
    if (stopped) return;
    document.querySelectorAll(".pin.spot").forEach(e => e.classList.remove("spot"));
    const pool = places.concat(kids).filter(i => PHOTO_SRC[i.id]);
    if (!pool.length) {
      if (++tries > 8) finish(); else siteTimer = setTimeout(nextSite, 600);
      return;
    }
    const choices = pool.length > 1 ? pool.filter(i => i.id !== lastId) : pool;
    const it = choices[Math.floor(Math.random() * choices.length)];
    lastId = it.id;

    const tgt = it.el.style.display !== "none" ? it : (it.parent || it);
    const p = map.project(tgt.ll);
    siteBox.classList.toggle("right", p.x < window.innerWidth * 0.5);
    siteBox.style.setProperty("--c", it.color);

    const t = (it.d.DETAILS || "").trim(), m = /[.!?](\s|$)/.exec(t);
    let blurb = m ? t.slice(0, m.index + 1) : t;
    if (blurb.length > 170) blurb = blurb.slice(0, 167) + "...";
    const e = yr4(it.d.EST);

    document.getElementById("wsPhoto").src = PHOTO_SRC[it.id];
    document.getElementById("wsName").textContent = it.name;
    document.getElementById("wsText").textContent = blurb;
    document.getElementById("wsIn").textContent =
      [it.parent ? "In " + it.parent.name : "", e ? "Established " + e : ""].filter(Boolean).join(" \u00b7 ");

    tgt.el.classList.add("spot");

    const box = document.getElementById("wsBox");
    const bl = box.offsetLeft, bt = box.offsetTop, br = bl + box.offsetWidth, bb = bt + box.offsetHeight;
    const sx = Math.max(bl, Math.min(p.x, br)), sy = Math.max(bt, Math.min(p.y, bb));
    let dx = p.x - sx, dy = p.y - sy;
    const L = Math.hypot(dx, dy) || 1; dx /= L; dy /= L;
    const w = 14;

    document.getElementById("wsLine").innerHTML =
      `<path style="fill:${it.color}" d="M${sx - dy * w},${sy + dx * w}L${p.x},${p.y}L${sx + dy * w},${sy - dx * w}Z"/>`;

    siteBox.classList.remove("in"); void siteBox.offsetWidth; siteBox.classList.add("in");
    siteTimer = setTimeout(nextSite, WELCOME_SITE_TIME);
  }

  function finish(){
    if (stopped) return;
    stopped = true;
    clearTimeout(timer);
    clearTimeout(siteTimer);
    document.querySelectorAll(".pin.spot").forEach(e => e.classList.remove("spot"));

    overlay.classList.remove("show");
    overlay.classList.add("exit");

    setTimeout(() => { overlay.remove(); }, WELCOME_TRANSITION_TIME);
  }

  function showNext(){
    if (stopped) return;
    if (index >= WELCOME_STEPS.length) { finish(); return; }

    const step = WELCOME_STEPS[index];
    index++;
    if (step.type === "sites") { startSites(); return; }

    image.src = step.gif;

    overlay.classList.remove("show", "exit");
    void image.offsetWidth;

    requestAnimationFrame(() => {
      if (stopped) return;
      overlay.classList.add("show");

      timer = setTimeout(() => {
        if (stopped) return;
        overlay.classList.remove("show");
        overlay.classList.add("exit");

        setTimeout(() => {
          if (stopped) return;
          overlay.classList.remove("exit");
          showNext();
        }, WELCOME_TRANSITION_TIME);
      }, WELCOME_DISPLAY_TIME);
    });
  }

  overlay.addEventListener("click", finish);
  document.addEventListener("keydown", e => { if (e.key === "Escape") finish(); }, { once:true });

  showNext();
}

/* ============================================================
   SITE SETTINGS
   ============================================================ */

const SITE = {
  center: [-85.13889209220456, 39.64753066097082],
  zoom: 14,
  maxBounds: [[-85.40,39.45],[-84.95,39.80]],
  childZoom: 16,
  colors: {
    IND:"#AF350A", CIV:"#E2E1E0", TRANS:"#91AF45",
    COMM:"#E47303", RES:"#BDD76B", default:"#E47303"
  },
  yearMin: 1850,
  yearMax: 2030,
  overlays: [
    {
      name: "1901 Sanborn Map",
      url: "1901-connersville-map.jpg",
      coords: [
        [-85.145019,39.658842],
        [-85.120412,39.658842],
        [-85.120412,39.630195],
        [-85.145019,39.630195]
      ]
    }
  ],
  memoryUrl: "mailto:connersville@example.org",
  files: {
    locations: "locations.csv",
    children: "childmarkers.csv",
    boundary: "connersville.geojson"
  }
};

const $ = id => document.getElementById(id);

const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({
  "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;"
}[c]));

const key = s => String(s || "").trim().toLowerCase();

/* ============================================================
   MAP
   ============================================================ */

const map = new maplibregl.Map({
  container: "map",
  style: {
    version: 8,
    sources: {
      osm: {
        type: "raster",
        tiles: ["https://tile.openstreetmap.org/{z}/{x}/{y}.png"],
        tileSize: 256,
        maxzoom: 19,
        attribution: "&copy; OpenStreetMap contributors"
      }
    },
    layers: [ { id:"osm", type:"raster", source:"osm" } ]
  },
  center: SITE.center,
  zoom: SITE.zoom,
  maxBounds: SITE.maxBounds
});

if (new URLSearchParams(location.search).has("spot")) {
  const w = document.getElementById("welcomeOverlay");
  if (w) w.remove();
} else {
  startWelcome();
}

map.addControl(new maplibregl.NavigationControl({ showCompass:false }), "bottom-right");
map.addControl(new maplibregl.ScaleControl(), "bottom-left");

const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
svg.id = "leaders";
map.getCanvasContainer().appendChild(svg);

let places = [], kids = [], focus = null, sel = null, prev = null;
let returning = false, year = null, stops = [], tourI = -1, me = null;

/* ============================================================
   THUMBNAILS
   ============================================================ */

const EXT = ["jpg","jpeg","png","webp","JPG","PNG"];
const PHOTO_SRC = {};

function thumb(id){
  const im = new Image();
  im.alt = "";
  let i = 0;

  const go = () => { im.src = "thumbs/" + encodeURIComponent(id) + "." + EXT[i]; };

  im.onerror = () => {
    if (++i < EXT.length) { go(); }
    else {
      im.remove();
      console.warn("No thumbnail found for " + id + " (looked for thumbs/" + id + ".jpg, .jpeg, .png, .webp)");
    }
  };

  im.onload = () => { PHOTO_SRC[id] = im.currentSrc || im.src; };
  go();
  return im;
}

/* ============================================================
   CSV LOADING
   ============================================================ */

function load(file){
  return new Promise(resolve =>
    Papa.parse(file, {
      download: true,
      header: true,
      skipEmptyLines: "greedy",
      complete: r => resolve(r.data),
      error: () => { console.warn("Could not load " + file); resolve([]); }
    })
  );
}

/* ============================================================
   MAP PINS
   ============================================================ */

function makePin(item, cls){
  const b = document.createElement("button");
  b.type = "button";
  b.className = "pin " + cls;

  if (/\d{4}/.test(item.d.CLSD || "")) b.classList.add("gone");

  b.setAttribute("aria-label", item.name);
  b.appendChild(thumb(item.id));

  item.r = cls === "parent" ? 29 : 22;
  item.color = SITE.colors[String(item.d.CATEGORY || "").trim().toUpperCase()] || SITE.colors.default;
  b.style.setProperty("--c", item.color);

  b.onclick = e => { e.stopPropagation(); select(item); };

  item.el = b;
  item.marker = new maplibregl.Marker({ element:b }).setLngLat(item.ll).addTo(map);
}

/* ============================================================
   LOAD MAP DATA
   ============================================================ */

map.on("load", async () => {

  map.addSource("boundary", { type:"geojson", data: SITE.files.boundary });

  map.addLayer({
    id: "boundary",
    type: "line",
    source: "boundary",
    paint: { "line-color":"#E47303", "line-width":2, "line-dasharray":[3,2] }
  });

  const [L,C] = await Promise.all([
    load(SITE.files.locations),
    load(SITE.files.children)
  ]);

  L.forEach(r => {
    const ll = [parseFloat(r.LONG), parseFloat(r.LAT)];
    if (!key(r.ID) || ll.some(isNaN)) {
      console.warn("Skipped location row:", r);
      return;
    }
    places.push({ id: r.ID.trim(), name: r.NAME || r.ID, ll, d:r, kids:[] });
  });

  C.forEach(r => {
    const id = (r.CHILD_ID || r.CHILD_IS || "").trim();
    const ll = [parseFloat(r.LONG), parseFloat(r.LAT)];
    const parent = places.find(p => key(p.id) === key(r.PARENT_ID));

    if (!id || ll.some(isNaN) || !parent) {
      console.warn("Skipped child row (bad ID, coordinates, or PARENT_ID):", r);
      return;
    }

    const k = { id, name: r.NAME || id, ll, d:r, parent, off:[0,0] };
    parent.kids.push(k);
    kids.push(k);
  });

  places.forEach(p => makePin(p, p.kids.length ? "parent" : "place"));
  kids.forEach(k => makePin(k, "child"));

  stops = places.concat(kids)
    .filter(i => parseFloat(i.d.TOUR) > 0)
    .sort((a,b) => parseFloat(a.d.TOUR) - parseFloat(b.d.TOUR));

  $("tour").hidden = !stops.length;

  initOverlays();
  update();
});

/* ============================================================
   YEAR FILTER
   ============================================================ */

const yr4 = v => {
  const m = /\d{4}/.exec(v || "");
  return m ? +m[0] : null;
};

function alive(i){
  if (year === null) return true;
  const e = yr4(i.d.EST);
  const c = yr4(i.d.CLSD);
  return (e === null || e <= year) && (c === null || c > year);
}

function update(){
  const deep = !returning && map.getZoom() >= SITE.childZoom;

  const show = (i,v) => { i.el.style.display = (v && alive(i)) ? "" : "none"; };

  places.forEach(p => show(p, !focus && !(p.kids.length && deep)));
  kids.forEach(k => show(k, focus ? k.parent === focus : deep));

  declutter();
  drawLeaders();
}

/* ============================================================
   LEADER LINE COLLISION DETECTION
   ============================================================ */

function segDist(px,py,ax,ay,bx,by){
  const dx = bx - ax, dy = by - ay;
  let t = ((px-ax)*dx + (py-ay)*dy) / ((dx*dx + dy*dy) || 1);
  t = Math.max(0, Math.min(1, t));
  return Math.hypot(px - ax - t*dx, py - ay - t*dy);
}

/* ============================================================
   DECLUTTER MARKERS
   ============================================================ */

function declutter(){
  const rank = i => (i.kids && i.kids.length) ? 0 : (i.parent ? 2 : 1);

  const vis = places.concat(kids)
    .filter(i => i.el.style.display !== "none")
    .sort((a,b) => rank(a) - rank(b));

  const placed = [];

  vis.forEach(it => {
    const p = map.project(it.ll);
    const base = it.r + 12;
    const fixed = rank(it) === 0;

    let o = [0,-base];
    let bestScore = Infinity;

    search:
    for (let ring=0; ring<8; ring++){
      const R = base + ring*34;
      const n = ring ? 8 + ring*4 : 1;

      for (let i=0; i<n; i++){
        const step = Math.ceil(i/2) * (i%2 ? 1 : -1);
        const a = -Math.PI/2 + 2*Math.PI*step/n;
        const dx = Math.cos(a)*R, dy = Math.sin(a)*R;
        const t = { x: p.x + dx, y: p.y + dy };
        let pen = 0;

        if (!fixed) {
          placed.forEach(q => {
            pen += Math.max(0, q.r + it.r + 4 - Math.hypot(q.x - t.x, q.y - t.y));
            pen += Math.max(0, it.r + 3 - segDist(t.x, t.y, q.tx, q.ty, q.x, q.y));

            if (Math.hypot(q.x - p.x, q.y - p.y) > q.r + 3) {
              pen += Math.max(0, q.r + 3 - segDist(q.x, q.y, p.x, p.y, t.x, t.y));
            }
          });
        }

        if (pen < bestScore) { bestScore = pen; o = [dx, dy]; }
        if (pen === 0) break search;
      }
    }

    it.off = o;
    it.marker.setOffset(o);

    placed.push({ x: p.x + o[0], y: p.y + o[1], r: it.r, tx: p.x, ty: p.y });
  });
}

/* ============================================================
   DRAW LEADER LINES
   ============================================================ */

function drawLeaders(){
  let h = "";

  places.concat(kids).forEach(it => {
    if (it.el.style.display === "none" || !it.off) return;

    const t = map.project(it.ll);
    const L = Math.hypot(it.off[0], it.off[1]) || 1;
    const ux = it.off[0] / L, uy = it.off[1] / L;
    const w = it.r * 0.4;

    const bx = t.x + it.off[0] - ux * (it.r - 3);
    const by = t.y + it.off[1] - uy * (it.r - 3);

    h += `<path style="fill:${it.color}" d="M${bx - uy*w},${by + ux*w}L${t.x},${t.y}L${bx + uy*w},${by - ux*w}Z"/>`;
  });

  svg.innerHTML = h;
}

map.on("zoomend", update);
map.on("render", drawLeaders);

/* ============================================================
   SELECT PLACE
   ============================================================ */

function select(it){

  if (tourI >= 0 && stops[tourI] !== it) tourI = -1;

  if (!sel && !prev) prev = { center: map.getCenter(), zoom: map.getZoom() };

  sel = it;

  places.concat(kids).forEach(i => i.el.classList.toggle("sel", i === it));

  if (it.kids && it.kids.length) {
    focus = it;
    const b = new maplibregl.LngLatBounds();
    it.kids.forEach(k => b.extend(k.ll));
    map.fitBounds(b, { padding:90, maxZoom:18 });
  } else {
    focus = it.parent || null;
    map.easeTo({ center: it.ll, zoom: Math.max(map.getZoom(), it.parent ? 17 : 15) });
  }

  const d = it.d;
  const panel = $("panel");

  panel.innerHTML =
    `<button id="x" aria-label="Close">&times;</button>` +
    `<h2>${esc(it.name)}</h2>` +
    (d.HIST_NAMES ? `<p><b>Also known as:</b> ${esc(d.HIST_NAMES)}</p>` : "") +
    (d.ADDRESS ? `<p><b>Address:</b> ${esc(d.ADDRESS)}</p>` : "") +
    `<p>${esc(d.DETAILS || "")}</p>` +
    (it.kids && it.kids.length
      ? "<h3>Places here</h3>" +
        it.kids.map(k => `<button class="kid" data-id="${esc(k.id)}">${esc(k.name)}</button>`).join("")
      : "");

  panel.insertBefore(thumb(it.id), panel.querySelector("h2"));

  const e = yr4(d.EST);
  const c = yr4(d.CLSD);

  const when = [
    e ? "Established " + e : "",
    c ? "Closed " + c : (e ? "Still standing" : "")
  ].filter(Boolean).join(" &middot; ");

  if (when) {
    panel.querySelector("h2").insertAdjacentHTML("afterend", `<p><b>${when}</b></p>`);
  }

  if (SITE.memoryUrl) {
    const m = SITE.memoryUrl.startsWith("mailto:")
      ? SITE.memoryUrl + "?subject=" + encodeURIComponent("Memory of " + it.name + " (" + it.id + ")")
      : SITE.memoryUrl;

    panel.insertAdjacentHTML("beforeend",
      `<p><a href="${esc(m)}" target="_blank" rel="noopener">Do you have a memory or photo of this place? Share it</a></p>`);
  }

  if (tourI >= 0 && stops[tourI] === it) {
    panel.insertAdjacentHTML("beforeend",
      `<p><b>Tour stop ${tourI + 1} of ${stops.length}</b></p>` +
      `<button class="kid" data-t="-1" ${tourI ? "" : "disabled"}>&larr; Back</button>` +
      `<button class="kid" data-t="1" ${tourI < stops.length - 1 ? "" : "disabled"}>Next: ${esc((stops[tourI + 1] || {}).name || "end of tour")} &rarr;</button>`);
  }

  panel.hidden = false;
  update();
}

/* ============================================================
   DESELECT
   ============================================================ */

function deselect(){
  if (!sel) return;

  sel = null; focus = null; tourI = -1;
  $("panel").hidden = true;

  places.concat(kids).forEach(i => i.el.classList.remove("sel"));

  if (prev) {
    returning = true;
    update();
    map.flyTo({ center: prev.center, zoom: prev.zoom });
    prev = null;
    map.once("moveend", () => { returning = false; update(); });
  } else {
    update();
  }
}

/* ============================================================
   PANEL / MAP EVENTS
   ============================================================ */

$("panel").onclick = e => {
  if (e.target.closest("#x")) { deselect(); return; }

  const t = e.target.closest("[data-t]");
  if (t && !t.disabled) { tourGo(tourI + +t.dataset.t); return; }

  const b = e.target.closest(".kid");
  if (b) {
    const k = kids.find(x => x.id === b.dataset.id);
    if (k) select(k);
  }
};

map.on("click", () => { $("res").hidden = true; deselect(); });
map.on("resize", update);

function tourGo(n){ tourI = n; select(stops[n]); }
$("tour").onclick = () => tourGo(0);

/* ============================================================
   YEAR SLIDER
   ============================================================ */

$("yr").min = SITE.yearMin;
$("yr").max = SITE.yearMax;
$("yr").step = 10;
$("yr").value = SITE.yearMax;

$("yr").oninput = e => {
  const v = +e.target.value;
  year = v >= SITE.yearMax ? null : v;
  $("yv").textContent = year === null ? "All" : year;
  update();
};

/* ============================================================
   OLD MAP OVERLAYS
   ============================================================ */

function initOverlays(){
  const o = SITE.overlays;
  if (!o.length) return;

  o.forEach((x,n) => {
    map.addSource("ov" + n, { type:"image", url: x.url, coordinates: x.coords });
    map.addLayer({
      id: "ov" + n, type: "raster", source: "ov" + n,
      paint: { "raster-opacity": 0 }
    }, "boundary");
  });

  $("ovs").innerHTML = o.map((x,n) =>
    `<option value="${n}">${esc(x.name)}</option>`
  ).join("");

  $("ovs").hidden = o.length < 2;
  $("ovw").hidden = false;

  const apply = () => o.forEach((x,n) =>
    map.setPaintProperty("ov" + n, "raster-opacity",
      n == $("ovs").value ? $("ov").value / 100 : 0)
  );

  $("ov").oninput = apply;
  $("ovs").onchange = apply;
}

/* ============================================================
   NEAR ME
   ============================================================ */

$("near").onclick = () => {
  const r = $("res");

  const say = t => {
    r.innerHTML = `<li style="padding:10px">${t}</li>`;
    r.hidden = false;
  };

  if (!navigator.geolocation) { say("Location isn't available on this device."); return; }
  say("Finding you...");

  navigator.geolocation.getCurrentPosition(
    pos => {
      const ll = [pos.coords.longitude, pos.coords.latitude];
      const b = SITE.maxBounds;

      if (ll[0] < b[0][0] || ll[0] > b[1][0] || ll[1] < b[0][1] || ll[1] > b[1][1]) {
        say("You appear to be outside the map area."); return;
      }

      if (me) me.remove();

      const dot = document.createElement("div");
      dot.style.cssText = "width:16px;height:16px;border-radius:50%;background:#0072B2;border:3px solid #fff;box-shadow:0 0 0 2px #0072B2";
      me = new maplibregl.Marker({ element: dot }).setLngLat(ll).addTo(map);

      const mi = c => {
        const q = Math.PI / 180;
        const a = Math.sin((c[1]-ll[1])*q/2)**2 +
                  Math.cos(ll[1]*q)*Math.cos(c[1]*q)*Math.sin((c[0]-ll[0])*q/2)**2;
        return 2 * 3958.8 * Math.asin(Math.sqrt(a));
      };

      const hits = places.concat(kids)
        .filter(alive)
        .map(h => ({ i:h, d:mi(h.ll) }))
        .sort((a,b) => a.d - b.d)
        .slice(0,5);

      r._hits = hits.map(h => h.i);

      r.innerHTML =
        "<li style='padding:8px 10px;font-size:12px'>Nearest to you (approximate; not for navigation)</li>" +
        hits.map((h,n) =>
          `<li><button data-i="${n}">${esc(h.i.name)} <small>${h.d < 0.1 ? Math.round(h.d*5280) + " ft" : h.d.toFixed(1) + " mi"}</small></button></li>`
        ).join("");

      map.easeTo({ center: ll, zoom: Math.max(map.getZoom(), 15) });
    },
    () => say("Couldn't get your location. Check your browser's location permission."),
    { enableHighAccuracy:true, timeout:10000 }
  );
};

/* ============================================================
   SEARCH
   ============================================================ */

$("q").oninput = e => {
  const s = e.target.value.trim().toLowerCase();
  const r = $("res");

  if (!s) { r.hidden = true; return; }

  const hits = places.concat(kids).filter(i =>
    (i.name + " " + (i.d.HIST_NAMES || "") + " " + (i.d.ADDRESS || ""))
      .toLowerCase().includes(s)
  ).slice(0,8);

  r.innerHTML =
    hits.map((h,i) => `<li><button data-i="${i}">${esc(h.name)}</button></li>`).join("") ||
    "<li style='padding:10px'>No matches</li>";

  r._hits = hits;
  r.hidden = false;
};

$("res").onclick = e => {
  const b = e.target.closest("button");
  if (b) { select($("res")._hits[b.dataset.i]); $("res").hidden = true; }
};

/* ============================================================
   QR "WHAT USED TO BE HERE?" SPOTS
   ============================================================ */
(function () {
  const id = new URLSearchParams(location.search).get("spot");
  if (!id) return;

  const box = $("spotBox");
  const close = () => { box.hidden = true; };

  $("sp-x").onclick = close;
  $("sp-go").onclick = close;
  box.onclick = e => { if (e.target === box) close(); };
  document.addEventListener("keydown", e => { if (e.key === "Escape") close(); });

  map.once("load", async () => {
    const r = (await load("spots.csv")).find(x => key(x.SPOT_ID) === key(id));
    if (!r) { console.warn("No spot called " + id + " in spots.csv"); return; }

    const ll = [parseFloat(r.LONG), parseFloat(r.LAT)];
    if (ll.some(isNaN)) { console.warn("Spot " + id + " has bad coordinates"); return; }

    map.jumpTo({ center: ll, zoom: 18 });

    const pin = document.createElement("div");
    pin.className = "spotpin";
    new maplibregl.Marker({ element: pin }).setLngLat(ll).addTo(map);

    $("sp-img").hidden = !r.PHOTO;
    if (r.PHOTO) $("sp-img").src = r.PHOTO;
    $("sp-title").textContent = r.TITLE || "What used to be here?";
    $("sp-when").textContent = r.YEAR || "";
    $("sp-text").textContent = r.DETAILS || "";
    $("sp-credit").textContent = r.CREDIT ? "Photo: " + r.CREDIT : "";
    box.hidden = false;
  });
})();

/* ============================================================
   PHOTO SPOTS, STORIES, TOURS
   ============================================================ */
(function () {

  document.head.insertAdjacentHTML("beforeend", `<style>
.kmark{width:44px;height:44px;border:0;background:none;padding:0;cursor:pointer;display:flex;align-items:center;justify-content:center}
.kmark svg{filter:drop-shadow(0 0 2px #fff) drop-shadow(0 0 2px #fff)}
.kmark.story svg{animation:ktw 2.4s ease-in-out infinite}
@keyframes ktw{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.25);opacity:.7}}
@media(prefers-reduced-motion:reduce){.kmark.story svg{animation:none}}
.tring{width:64px;height:64px;border-radius:50%;border:5px solid #D55E00;box-shadow:0 0 0 3px #fff,0 0 14px #000a;pointer-events:none;animation:kring 1.6s ease-out infinite}
@keyframes kring{0%{transform:scale(.8)}70%{transform:scale(1.15)}100%{transform:scale(.8)}}
@media(prefers-reduced-motion:reduce){.tring{animation:none}}
#klegend{position:absolute;left:8px;bottom:42px;z-index:4;background:#fffe;padding:4px 8px;border-radius:6px;font-size:12px;display:flex;gap:12px}
#klegend span{display:flex;align-items:center;gap:4px}
#tourCard{position:fixed;left:0;right:0;bottom:0;z-index:7;max-height:48vh;overflow:auto;background:#fff;border-top:6px solid #D55E00;padding:12px 14px calc(14px + env(safe-area-inset-bottom));box-sizing:border-box}
#tourCard[hidden]{display:none}
#tourCard img{max-height:150px;max-width:100%;border-radius:8px;display:block;margin-bottom:6px}
#tourCard h2{margin:4px 0}
#tourCard small{display:block;color:#555}
</style>`);

  const icon = (kind, c) => kind === "story"
    ? `<svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M12 1l2.6 7.4L22 11l-7.4 2.6L12 21l-2.6-7.4L2 11l7.4-2.6z" fill="${c}" stroke="#fff" stroke-width="1.2"/></svg>`
    : `<svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><rect x="8" y="3" width="8" height="4" rx="1" fill="${c}"/><rect x="2" y="6" width="20" height="14" rx="3" fill="${c}" stroke="#fff" stroke-width="1.2"/><circle cx="12" cy="13" r="4" fill="#fff"/></svg>`;

  let items = [];
  let showAll = false;
  let tours = [];
  let T = null;
  let ti = 0;
  let ring = null;

  const box = $("spotBox");

  if (!new URLSearchParams(location.search).has("spot")) {
    $("sp-x").onclick = $("sp-go").onclick = () => { box.hidden = true; };
    box.onclick = e => { if (e.target === box) box.hidden = true; };
  }

  document.addEventListener("keydown", e => { if (e.key === "Escape") box.hidden = true; });

  function showSpot(it) {
    const r = it.r;

    $("sp-img").hidden = !r.PHOTO;
    if (r.PHOTO) $("sp-img").src = r.PHOTO;
    $("sp-title").textContent = r.TITLE || "";
    $("sp-when").textContent = r.YEAR || "";
    $("sp-text").textContent = r.DETAILS || "";
    $("sp-credit").textContent =
      [r.CREDIT ? "Photo: " + r.CREDIT : "", r.SOURCE ? "Source: " + r.SOURCE : ""]
        .filter(Boolean).join(" · ");

    box.hidden = false;
  }

  const vis = () => {
    const z = map.getZoom();
    items.forEach(i => {
      if (i.el) i.el.style.display = (showAll || z >= 16) ? "" : "none";
    });
  };

  const byId = id => {
    const k = key(id);
    return places.concat(kids).find(p => key(p.id) === k) ||
           items.find(i => key(i.id) === k);
  };

  function clearHi() { if (ring) { ring.remove(); ring = null; } }

  function go(n) {
    ti = n;
    clearHi();

    const st = T.stops[n];
    const it = byId(st.ITEM_ID);
    const card = $("tourCard");

    let name = "Missing item: " + st.ITEM_ID;
    let when = "", text = "", credit = "", ll = null, img = null;

    if (it && it.r) {
      const r = it.r;
      name = r.TITLE;
      when = r.YEAR || "";
      text = r.DETAILS || "";
      ll = it.ll;

      if (r.PHOTO) {
        img = new Image();
        img.alt = "";
        img.src = r.PHOTO;
        img.onerror = () => { img.remove(); };
      }

      credit = [r.CREDIT ? "Photo: " + r.CREDIT : "", r.SOURCE ? "Source: " + r.SOURCE : ""]
        .filter(Boolean).join(" · ");
    } else if (it) {
      name = it.name;
      text = it.d.DETAILS || "";
      ll = it.ll;
      img = thumb(it.id);
    }

    if (ll) {
      focus = (it && it.parent) || null;
      update();

      const d = document.createElement("div");
      d.className = "tring";
      ring = new maplibregl.Marker({ element: d }).setLngLat(ll).addTo(map);

      map.flyTo({ center: ll, zoom: Math.max(map.getZoom(), 17) });
    }

    const nxt = T.stops[n + 1] && byId(T.stops[n + 1].ITEM_ID);

    card.innerHTML =
      `<h2></h2>` +
      `<small id="tw"></small>` +
      `<p id="tt"></p>` +
      `<p id="tn"><i></i></p>` +
      `<small id="tc"></small>` +
      `<p><b>${esc(T.title)}: stop ${n + 1} of ${T.stops.length}</b></p>` +
      `<button class="kid" data-g="-1" ${n ? "" : "disabled"}>&larr; Back</button>` +
      `<button class="kid" data-g="1" ${n < T.stops.length - 1 ? "" : "disabled"}>Next: ${esc(nxt ? (nxt.r ? nxt.r.TITLE : nxt.name) : "end of tour")} &rarr;</button>` +
      `<button class="kid" data-g="x">End tour</button>`;

    card.querySelector("h2").textContent = name;
    $("tw").textContent = when;
    $("tt").textContent = text;
    card.querySelector("#tn i").textContent = st.NOTE || "";
    $("tc").textContent = credit;

    if (img) card.insertBefore(img, card.firstChild);

    card.hidden = false;
  }

  function listTours() {
    const card = $("tourCard");

    card.innerHTML =
      `<h2>Tours</h2>` +
      tours.map((t,i) =>
        `<button class="kid" data-t="${i}"><b>${esc(t.title)}</b><br><small>${esc(t.intro)} (${t.stops.length} stops)</small></button>`
      ).join("") +
      `<button class="kid" data-g="x">Close</button>`;

    card.hidden = false;
  }

  document.body.insertAdjacentHTML("beforeend",
    `<aside id="tourCard" hidden aria-live="polite"></aside>` +
    `<div id="klegend">` +
      `<span>${icon("spot","#333333")} Photo spot</span>` +
      `<span>${icon("story","#D55E00")} Story</span>` +
    `</div>`);

  $("tour").insertAdjacentHTML("afterend",
    `<button id="tours" type="button" hidden>Tours</button>` +
    `<button id="stories" type="button" aria-pressed="false">Show All Stories and Spots</button>`);

  $("tours").onclick = listTours;

  $("stories").onclick = () => {
    showAll = !showAll;
    $("stories").setAttribute("aria-pressed", showAll);
    $("stories").textContent = showAll ? "Hide Stories / Spots" : "Show All Stories and Spots";
    vis();
  };

  $("tourCard").onclick = e => {
    const t = e.target.closest("[data-t]");
    const g = e.target.closest("[data-g]");

    if (t) {
      T = tours[+t.dataset.t];
      go(0);
    } else if (g && !g.disabled) {
      if (g.dataset.g === "x") {
        $("tourCard").hidden = true;
        clearHi();
        T = null;
        focus = null;
        update();
      } else {
        go(ti + +g.dataset.g);
      }
    }
  };

  map.once("load", async () => {
    const [S, TR, TS] = await Promise.all([
      load("spots.csv"),
      load("tours.csv"),
      load("tourstops.csv")
    ]);

    S.forEach(r => {
      const id = (r.SPOT_ID || "").trim();
      if (!id) return;

      const kind = key(r.KIND) === "story" ? "story" : "spot";
      const ll = [parseFloat(r.LONG), parseFloat(r.LAT)];
      const ok = !ll.some(isNaN);

      const it = { id, r, kind, ll: ok ? ll : null };

      if (ok) {
        const b = document.createElement("button");
        b.type = "button";
        b.className = "kmark " + kind;
        b.setAttribute("aria-label",
          (kind === "story" ? "Story: " : "Photo spot: ") + (r.TITLE || id));

        b.innerHTML = icon(kind, kind === "story" ? "#D55E00" : "#333333");

        b.onclick = e => { e.stopPropagation(); showSpot(it); };

        it.el = b;
        it.marker = new maplibregl.Marker({ element: b }).setLngLat(ll).addTo(map);
      } else if ((r.LAT || r.LONG || "").trim()) {
        console.warn("Spot " + id + " needs both LAT and LONG (or neither)");
      }

      items.push(it);
    });

    TR.forEach(r => {
      const id = (r.TOUR_ID || "").trim();
      if (!id) return;

      const stops = TS
        .filter(x => key(x.TOUR_ID) === key(id))
        .sort((a,b) => parseFloat(a.STEP) - parseFloat(b.STEP));

      if (stops.length) {
        tours.push({ id, title: r.TITLE || id, intro: r.INTRO || "", stops });
      }
    });

    $("tours").hidden = !tours.length;
    vis();
    map.on("zoomend", vis);
  });

})();

/* ============================================================
   ENHANCEMENTS
   ============================================================ */
(function () {

  const enhancementStyle = document.createElement("style");
  enhancementStyle.textContent = `
    #panel img,
    #spotCard img,
    #tourCard img { cursor: zoom-in; }

    #imgView {
      position: fixed;
      inset: 0;
      z-index: 99998;
      background: #000e;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: zoom-out;
    }
    #imgView[hidden] { display: none; }
    #imgView img {
      max-width: 96vw;
      max-height: 92vh;
      object-fit: contain;
    }
    #imgView button {
      position: absolute;
      top: 10px;
      right: 14px;
      font-size: 34px;
      color: #fff;
      background: none;
      border: 0;
    }

    @media (pointer: coarse), (max-width: 700px) {
      .kmark.story svg { animation: none; }
    }
  `;

  document.head.appendChild(enhancementStyle);

  document.body.insertAdjacentHTML("beforeend", `
    <div id="imgView" hidden role="dialog" aria-label="Enlarged photo">
      <img alt="">
      <button type="button" aria-label="Close">&times;</button>
    </div>
  `);

  const view = document.getElementById("imgView");
  const big = view.querySelector("img");

  const closeView = () => {
    view.hidden = true;
    big.removeAttribute("src");
  };

  document.addEventListener("click", e => {
    const im = e.target.closest("#panel img, #spotCard img, #tourCard img");
    if (!im) return;

    const src = im.getAttribute("src");
    if (!src) return;

    const shown = im.currentSrc || im.src;
    const larger = shown.replace("/thumbs/", "/photos/");

    big.onerror = () => { big.onerror = null; big.src = shown; };
    big.src = larger;
    view.hidden = false;
  });

  view.addEventListener("click", closeView);

  document.addEventListener("keydown", e => {
    if (e.key === "Escape" && !view.hidden) {
      closeView();
      e.stopPropagation();
    }
  }, true);

  if (!new URLSearchParams(location.search).has("spot")) {
    let tries = 0;

    const t = setInterval(() => {
      if (!places.length && ++tries <= 50) return;
      clearInterval(t);
      if (!places.length) return;

      const b = new maplibregl.LngLatBounds();
      places.forEach(p => b.extend(p.ll));

      const cam = map.cameraForBounds(b, {
        padding: { top: 160, bottom: 60, left: 40, right: 40 },
        maxZoom: 15
      });

      if (!cam) return;

      SITE.center = [cam.center.lng, cam.center.lat];
      SITE.zoom = cam.zoom;
      map.jumpTo({ center: SITE.center, zoom: SITE.zoom });
    }, 100);
  }

})();
