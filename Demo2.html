<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Explore Connersville's Past</title>
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<style>
html,body{margin:0;height:100%;font-family:Arial,sans-serif}
#bar{position:absolute;z-index:5;top:0;left:0;right:0;background:#E47303;color:#fff;padding:calc(6px + env(safe-area-inset-top)) 10px 8px}
#bar h1{font-size:17px;margin:0 0 6px}
#q{width:100%;box-sizing:border-box;padding:8px;font-size:16px;border:0;border-radius:4px}
#res{list-style:none;margin:2px 0 0;padding:0;background:#fff;color:#000;border-radius:4px;max-height:40vh;overflow:auto}
#res button{width:100%;text-align:left;padding:10px;border:0;background:none;font-size:15px;border-bottom:1px solid #eee}
#map{position:absolute;inset:0}
#leaders{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none;overflow:visible}
#leaders path{fill:#E47303;stroke:#fff;stroke-width:1.5}
.pin{width:44px;height:44px;border-radius:50%;border:3px solid var(--c,#E47303);background:#E47303;box-shadow:0 0 0 2px #fff,0 1px 4px #0007;padding:0;overflow:hidden;cursor:pointer}
.pin img{width:100%;height:100%;object-fit:cover;display:block}
.pin.parent{width:58px;height:58px;border:4px solid var(--c,#E47303);box-shadow:0 0 0 2px #fff,0 1px 5px #0008}
.pin:focus-visible{outline:3px solid #ff9800}
.pin.sel{border-color:#ff9800}
#panel{position:absolute;z-index:6;left:0;right:0;bottom:0;max-height:55vh;overflow:auto;background:#fff;padding:12px 14px calc(14px + env(safe-area-inset-bottom));box-shadow:0 -2px 8px #0005;box-sizing:border-box}
#panel img{width:100%;max-height:240px;object-fit:cover;border-radius:6px}
#panel h2{margin:8px 0 4px;font-size:19px}
#panel h3{margin:12px 0 4px;font-size:15px}
#x{position:absolute;right:8px;top:6px;font-size:26px;border:0;background:none}
.kid{display:block;width:100%;text-align:left;padding:10px;margin:3px 0;border:1px solid #E47303;border-radius:6px;background:#fff;font-size:15px}
@media(min-width:700px){#panel{left:auto;width:380px;top:96px;bottom:auto;max-height:calc(100% - 110px);right:10px;border-radius:8px}}
</style>
</head>
<body>
<div id="bar">
  <h1>Explore Connersville's Past</h1>
  <input id="q" type="search" placeholder="Search places..." aria-label="Search places">
  <ul id="res" hidden></ul>
</div>
<div id="map"></div>
<aside id="panel" hidden aria-live="polite"></aside>

<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script src="https://unpkg.com/papaparse@5.4.1/papaparse.min.js"></script>
<script>
// ============ SITE SETTINGS ============
const SITE = {
  center: [-85.1411, 39.6409],
  zoom: 14,
  maxBounds: [[-85.40, 39.45], [-84.95, 39.80]],   // [[west, south], [east, north]]
  childZoom: 16,   // at this zoom and closer, parents hide and their children show
  colors: { IND:"#AF350A", CIV:"E2E1E0", TRANS:"#91AF45", COMM:"#E47303", RES:#BDD76B, default:"#E47303" }, // Category colors
  files: { locations: "locations.csv", children: "childmarkers.csv", boundary: "connersville.geojson" }
};

const $ = id => document.getElementById(id);
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const key = s => String(s || "").trim().toLowerCase();

const map = new maplibregl.Map({
  container: "map",
  style: { version: 8,
    sources: { osm: { type: "raster", tiles: ["https://tile.openstreetmap.org/{z}/{x}/{y}.png"], tileSize: 256, maxzoom: 19, attribution: "&copy; OpenStreetMap contributors" } },
    layers: [{ id: "osm", type: "raster", source: "osm" }] },
  center: SITE.center, zoom: SITE.zoom, maxBounds: SITE.maxBounds
});
map.addControl(new maplibregl.NavigationControl({ showCompass: false }), "bottom-right");
map.addControl(new maplibregl.ScaleControl(), "bottom-left");

const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
svg.id = "leaders";
map.getCanvasContainer().appendChild(svg);

let places = [], kids = [], focus = null, sel = null, prev = null;

// Tries several file extensions in thumbs/ (names must match the ID exactly, including capitals).
const EXT = ["jpg", "jpeg", "png", "webp", "JPG", "PNG"];
function thumb(id) {
  const im = new Image(); im.alt = ""; let i = 0;
  const go = () => { im.src = "thumbs/" + encodeURIComponent(id) + "." + EXT[i]; };
  im.onerror = () => {
    if (++i < EXT.length) go();
    else { im.remove(); console.warn("No thumbnail found for " + id + " (looked for thumbs/" + id + ".jpg, .jpeg, .png, .webp)"); }
  };
  go();
  return im;
}

function load(file) {
  return new Promise(resolve => Papa.parse(file, {
    download: true, header: true, skipEmptyLines: "greedy",
    complete: r => resolve(r.data),
    error: () => { console.warn("Could not load " + file); resolve([]); }
  }));
}

function makePin(item, cls) {
  const b = document.createElement("button");
  b.type = "button";
  b.className = "pin " + cls;
  b.setAttribute("aria-label", item.name);
  b.appendChild(thumb(item.id));             // no thumbnail: plain teal circle
  item.r = cls === "parent" ? 29 : 22;       // circle radius in pixels
  item.color = SITE.colors[key(item.d.CATEGORY)] || SITE.colors.default;
  b.style.setProperty("--c", item.color);
  b.onclick = e => { e.stopPropagation(); select(item); };
  item.el = b;
  item.marker = new maplibregl.Marker({ element: b }).setLngLat(item.ll).addTo(map);
  item.color = SITE.colors[key(item.d.CATEGORY)] || SITE.colors.default; b.style.setProperty("--c", item.color);
}

map.on("load", async () => {
  map.addSource("boundary", { type: "geojson", data: SITE.files.boundary });
  map.addLayer({ id: "boundary", type: "line", source: "boundary", paint: { "line-color": "#E47303", "line-width": 2, "line-dasharray": [3, 2] } });

  const [L, C] = await Promise.all([load(SITE.files.locations), load(SITE.files.children)]);

  L.forEach(r => {
    const ll = [parseFloat(r.LONG), parseFloat(r.LAT)];
    if (!key(r.ID) || ll.some(isNaN)) { console.warn("Skipped location row:", r); return; }
    places.push({ id: r.ID.trim(), name: r.NAME || r.ID, ll, d: r, kids: [] });
  });

  C.forEach(r => {
    const id = (r.CHILD_ID || r.CHILD_IS || "").trim();     // accepts the CHILD_IS spelling too
    const ll = [parseFloat(r.LONG), parseFloat(r.LAT)];
    const parent = places.find(p => key(p.id) === key(r.PARENT_ID));
    if (!id || ll.some(isNaN) || !parent) { console.warn("Skipped child row (bad ID, coordinates, or PARENT_ID):", r); return; }
    const k = { id, name: r.NAME || id, ll, d: r, parent, off: [0, 0] };
    parent.kids.push(k);
    kids.push(k);
  });

  places.forEach(p => makePin(p, p.kids.length ? "parent" : "place"));
  kids.forEach(k => makePin(k, "child"));
  update();
});

// While a parent is selected, only its children show. Otherwise: parents when zoomed out, children when zoomed in.
function update() {
  const deep = map.getZoom() >= SITE.childZoom;
  places.forEach(p => { p.el.style.display = focus ? "none" : (p.kids.length && deep ? "none" : ""); });
  kids.forEach(k => { k.el.style.display = focus ? (k.parent === focus ? "" : "none") : (deep ? "" : "none"); });
  declutter();
  drawLeaders();
}

// Distance from point (px,py) to the line segment (ax,ay)-(bx,by).
function segDist(px, py, ax, ay, bx, by) {
  const dx = bx - ax, dy = by - ay;
  let t = ((px - ax) * dx + (py - ay) * dy) / ((dx * dx + dy * dy) || 1);
  t = Math.max(0, Math.min(1, t));
  return Math.hypot(px - ax - t * dx, py - ay - t * dy);
}

// Every marker is a circle with a pointer whose tip sits on the true location.
// The circle rests straight above the tip; if it would overlap another circle it moves
// around the tip in rings, and the pointer stretches. Parents never move.
function declutter() {
  const rank = i => i.kids && i.kids.length ? 0 : (i.parent ? 2 : 1);
  const vis = places.concat(kids).filter(i => i.el.style.display !== "none").sort((a, b) => rank(a) - rank(b));
  const placed = [];
  vis.forEach(it => {
    const p = map.project(it.ll), base = it.r + 12, fixed = rank(it) === 0;
    let c = null, o = [0, -base];
    for (let ring = 0; ring < 8 && !c; ring++) {
      const R = base + ring * 34, n = ring ? 8 + ring * 4 : 1;
      for (let i = 0; i < n; i++) {
        const step = Math.ceil(i / 2) * (i % 2 ? 1 : -1), a = -Math.PI / 2 + 2 * Math.PI * step / n, dx = Math.cos(a) * R, dy = Math.sin(a) * R;
        const t = { x: p.x + dx, y: p.y + dy };
        o = [dx, dy];
        if (fixed || placed.every(q =>
          Math.hypot(q.x - t.x, q.y - t.y) >= q.r + it.r + 4 &&
          segDist(t.x, t.y, q.tx, q.ty, q.x, q.y) >= it.r + 3 &&
          segDist(q.x, q.y, p.x, p.y, t.x, t.y) >= q.r + 3)) { c = t; break; }
      }
    }
    it.off = o;
    it.marker.setOffset(o);
    placed.push({ x: p.x + o[0], y: p.y + o[1], r: it.r, tx: p.x, ty: p.y });
  });
}

// Tapered pointer: wide at the circle, narrowing to the true location.
function drawLeaders() {
  let h = "";
  places.concat(kids).forEach(it => {
    if (it.el.style.display === "none" || !it.off) return;
    const t = map.project(it.ll), L = Math.hypot(it.off[0], it.off[1]) || 1;
    const ux = it.off[0] / L, uy = it.off[1] / L, w = it.r * 0.4;
    const bx = t.x + it.off[0] - ux * (it.r - 3), by = t.y + it.off[1] - uy * (it.r - 3);
    h += `<path d="M${bx - uy * w},${by + ux * w}L${t.x},${t.y}L${bx + uy * w},${by - ux * w}Z"/>`;
  });
  svg.innerHTML = h;
}
map.on("zoomend", update);
map.on("render", drawLeaders);

function select(it) {
  if (!sel && !prev) prev = { center: map.getCenter(), zoom: map.getZoom() };   // remember the view to return to
  sel = it;
  places.concat(kids).forEach(i => i.el.classList.toggle("sel", i === it));
  if (it.kids && it.kids.length) {
    focus = it;
    const b = new maplibregl.LngLatBounds();
    it.kids.forEach(k => b.extend(k.ll));
    map.fitBounds(b, { padding: 90, maxZoom: 18 });
  } else {
    if (it.parent) focus = it.parent;
    map.easeTo({ center: it.ll, zoom: Math.max(map.getZoom(), it.parent ? 17 : 15) });
  }
  const d = it.d, panel = $("panel");
  panel.innerHTML =
    `<button id="x" aria-label="Close">&times;</button><h2>${esc(it.name)}</h2>` +
    (d.HIST_NAMES ? `<p><b>Also known as:</b> ${esc(d.HIST_NAMES)}</p>` : "") +
    (d.ADDRESS ? `<p><b>Address:</b> ${esc(d.ADDRESS)}</p>` : "") +
    `<p>${esc(d.DETAILS || "")}</p>` +
    (it.kids && it.kids.length ? "<h3>Places here</h3>" + it.kids.map(k => `<button class="kid" data-id="${esc(k.id)}">${esc(k.name)}</button>`).join("") : "");
  panel.insertBefore(thumb(it.id), panel.querySelector("h2"));
  panel.hidden = false;
  update();
}

// X or a click on the map: show everything again and zoom back to where the visitor was.
function deselect() {
  if (!sel) return;
  sel = null; focus = null;
  $("panel").hidden = true;
  places.concat(kids).forEach(i => i.el.classList.remove("sel"));
  update();
  if (prev) { map.flyTo({ center: prev.center, zoom: prev.zoom }); prev = null; }
}

$("panel").onclick = e => {
  if (e.target.closest("#x")) { deselect(); return; }
  const b = e.target.closest(".kid");
  if (b) { const k = kids.find(x => x.id === b.dataset.id); if (k) select(k); }
};
map.on("click", () => { $("res").hidden = true; deselect(); });
map.on("resize", update);

$("q").oninput = e => {
  const s = e.target.value.trim().toLowerCase(), r = $("res");
  if (!s) { r.hidden = true; return; }
  const hits = places.concat(kids).filter(i => (i.name + " " + (i.d.HIST_NAMES || "") + " " + (i.d.ADDRESS || "")).toLowerCase().includes(s)).slice(0, 8);
  r.innerHTML = hits.map((h, i) => `<li><button data-i="${i}">${esc(h.name)}</button></li>`).join("") || "<li style='padding:10px'>No matches</li>";
  r._hits = hits;
  r.hidden = false;
};
$("res").onclick = e => {
  const b = e.target.closest("button");
  if (b) { select($("res")._hits[b.dataset.i]); $("res").hidden = true; }
};
</script>
</body>
</html>
